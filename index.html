<!-- ⚡ Lead Intake & Application Form -->
<section id="apply" class="py-20 bg-navy-dark">
    <div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="bg-navy-card border border-navy-border p-8 sm:p-12 rounded-sm shadow-2xl relative">
            <div class="text-center mb-10">
                <h2 class="text-2xl sm:text-3xl font-extrabold text-white mb-2">Activate Your Capital Search</h2>
                <p class="text-sm text-gray-400">Complete the form below to initiate underwriting review.</p>
            </div>

            <!-- Form pointing to Web3Forms API -->
            <form id="leadForm" action="https://api.web3forms.com/submit" method="POST" class="space-y-6">
                
                <!-- Web3Forms Access Key from your screenshot -->
                <input type="hidden" name="access_key" value="d433aacf-0c31-4eda-962a-6f8634ae6ff8">
                <input type="hidden" name="subject" value="⚡ NEW LEAD: F1 Cash Application">
                
                <!-- Anti-Spam Honeypot -->
                <input type="checkbox" name="botcheck" class="hidden" style="display: none;">

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-xs font-semibold text-gray-300 uppercase mb-2">Business Name</label>
                        <input type="text" name="business_name" required class="w-full bg-navy-dark border border-navy-border rounded-sm px-4 py-3 text-white focus:outline-none focus:border-cyan-electric text-sm" placeholder="Apex Logistics LLC">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-300 uppercase mb-2">Full Name</label>
                        <input type="text" name="full_name" required class="w-full bg-navy-dark border border-navy-border rounded-sm px-4 py-3 text-white focus:outline-none focus:border-cyan-electric text-sm" placeholder="John Doe">
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-xs font-semibold text-gray-300 uppercase mb-2">Work Email</label>
                        <input type="email" name="email" required class="w-full bg-navy-dark border border-navy-border rounded-sm px-4 py-3 text-white focus:outline-none focus:border-cyan-electric text-sm" placeholder="john@apexlogistics.com">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-300 uppercase mb-2">Phone Number (10 Digits)</label>
                        <input 
                            type="tel" 
                            name="phone" 
                            required 
                            pattern="[0-9]{10}" 
                            maxlength="10" 
                            oninput="this.value = this.value.replace(/[^0-9]/g, '')"
                            title="Please enter a valid 10-digit US phone number (e.g. 5551234567)"
                            class="w-full bg-navy-dark border border-navy-border rounded-sm px-4 py-3 text-white focus:outline-none focus:border-cyan-electric text-sm" 
                            placeholder="5551234567"
                        >
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-xs font-semibold text-gray-300 uppercase mb-2">Monthly Revenue</label>
                        <select name="monthly_revenue" required class="w-full bg-navy-dark border border-navy-border rounded-sm px-4 py-3 text-white focus:outline-none focus:border-cyan-electric text-sm">
                            <option value="" disabled selected>Select Monthly Revenue</option>
                            <option value="0-10k">$0 – $10k</option>
                            <option value="10k-50k">$10k – $50k</option>
                            <option value="50k+">$50k+</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-300 uppercase mb-2">Time in Business</label>
                        <select name="time_in_business" required class="w-full bg-navy-dark border border-navy-border rounded-sm px-4 py-3 text-white focus:outline-none focus:border-cyan-electric text-sm">
                            <option value="" disabled selected>Select Timeframe</option>
                            <option value="0-6m">Under 6 Months</option>
                            <option value="6m-1y">6 Months – 1 Year</option>
                            <option value="1y-3y">1 – 3 Years</option>
                            <option value="3y+">3+ Years</option>
                        </select>
                    </div>
                </div>

                <!-- A2P 10DLC Mandatory Compliance Checkbox -->
                <div class="pt-2">
                    <label class="flex items-start space-x-3 text-xs text-gray-400 leading-relaxed cursor-pointer">
                        <input type="checkbox" name="a2p_sms_consent" value="accepted" required class="mt-1 h-4 w-4 bg-navy-dark border-navy-border rounded text-cyan-electric focus:ring-0">
                        <span>I agree to receive transactional and informational SMS messages from F1 Cash at the phone number provided. Message & data rates may apply. Reply STOP to unsubscribe.</span>
                    </label>
                </div>

                <button id="submitBtn" type="submit" class="w-full bg-cyan-electric text-navy-dark font-extrabold py-4 rounded-sm shadow-glow hover:shadow-glow-lg transition-all duration-300 uppercase tracking-widest text-sm">
                    SUBMIT APPLICATION GRID
                </button>
            </form>
            
            <!-- Result Feedback Notification -->
            <div id="resultMessage" class="hidden mt-4 text-center text-sm font-semibold"></div>
        </div>
    </div>
</section>

<!-- Place right before the closing </body> tag -->
<script>
    const form = document.getElementById('leadForm');
    const resultMessage = document.getElementById('resultMessage');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', function(e) {
        e.preventDefault();
        
        submitBtn.disabled = true;
        submitBtn.innerText = 'PROCESSING APPLICATION...';

        const formData = new FormData(form);
        const object = Object.fromEntries(formData);
        const json = JSON.stringify(object);

        fetch('https://api.web3forms.com/submit', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Accept': 'application/json'
            },
            body: json
        })
        .then(async (response) => {
            let resJson = await response.json();
            if (response.status === 200) {
                resultMessage.classList.remove('hidden', 'text-red-500');
                resultMessage.classList.add('text-cyan-electric');
                resultMessage.innerHTML = "⚡ Application Submitted Successfully! We will review your file shortly.";
                form.reset();
            } else {
                resultMessage.classList.remove('hidden', 'text-cyan-electric');
                resultMessage.classList.add('text-red-500');
                resultMessage.innerHTML = resJson.message || "An error occurred during submission.";
            }
        })
        .catch(error => {
            resultMessage.classList.remove('hidden', 'text-cyan-electric');
            resultMessage.classList.add('text-red-500');
            resultMessage.innerHTML = "Network error. Please check your connection and try again.";
        })
        .then(function() {
            submitBtn.disabled = false;
            submitBtn.innerText = 'SUBMIT APPLICATION GRID';
        });
    });
</script>
